apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-relay-config
  namespace: messaging-system
  labels:
    app: mail-relay
data:
  config.yaml: |
    listen_addr: ":2525"
    banner: "Mail Relay Ready"

    queue_interval: 10
    max_email_age: 72
    max_fail_count: 5
    worker_concurrency: 3

    redis:
      addrs:
        - "redis.database-system.svc:6379"
      password: "<REDIS_PASSWORD>"
      db: 0
      key_prefix: "mail-relay:"

    pool:
      max_idle_per_server: 5
      max_active_per_server: 10
      max_idle_time: 300
      max_lifetime: 1800
      max_messages_per_conn: 100
      dial_timeout: 30

    smtp_servers:
      - name: "aliyun"
        host: "smtpdm.aliyun.com"
        port: 465
        username: "<SMTP_USERNAME>"
        password: "<SMTP_PASSWORD>"
        from: "leaflow@bot.lifergroup.com"
        encryption: "ssl"
        weight: 10
        enabled: true
